site_name: BizFlo 操作マニュアル
site_description: BizFlo 外部向けドキュメント
theme:
  name: material
  language: ja
  logo: images/favicon.png  # ロゴ画像のパス
  favicon: images/favicon.png  # ファビコン（ブラウザタブのアイコン）
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - content.code.copy
use_directory_urls: true
docs_dir: docs
site_dir: site

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - ホーム: index.md
  - はじめに:
      - 初期設定ガイド: initial-setup.md
      - 運用・管理: operations.md
  - 営業・顧客:
      - 顧客管理: customer.md
      - 案件管理: project.md
      - タスク管理: tasks.md
      - スケジュール管理: schedule.md
  - 取引・会計:
      - 請求書管理: invoice.md
      - 受発注管理: order.md
      - 契約管理: contracts.md
      - 会計管理: accounting.md
  - 分析:
      - KPI管理: kpi.md
      - AIアシスタント: analysis.md
  - ツール・連携:
      - LINE連携: line.md
      - 予約管理: reservation.md
      - サイトアカウント管理: site-accounts.md
  - FAQ: faq.md
  - リリースノート: release-notes.md
  - 法務:
      - 利用規約: terms.md
      - プライバシーポリシー: privacy.md
